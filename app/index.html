<!DOCTYPE html>
<meta charset="UTF-8">
<html lang="ko">

<head>
  <script defer src="scripts/popup.js"></script>
  <link href="styles/popup.css" rel="stylesheet" />
  <link href="styles/label.css" rel="stylesheet" />
</head>

<body>
<div class="settings-card">
  <h3>배추 설정</h3>

  <div class="section">
    <label>
      <input id="toggle-badge" type="checkbox" />
      <span class="baechu-label-badge" style="color: white; padding: 4px 7px;">뱃지</span>
      표시
    </label>
  </div>

  <div class="section">
    <label>
      <input id="toggle-background" type="checkbox" />
      <span class="baechu-label-background" style="color: white; padding: 4px 7px;">배경</span>
      표시
    </label>
  </div>

  <div class="section">
    <label>
      <input id="toggle-warning" type="checkbox" />
      <span class="baechu-icon baechu-label-warning" style=""></span> 경고 표시
    </label>
  </div>
</div>
</body>
</html>
